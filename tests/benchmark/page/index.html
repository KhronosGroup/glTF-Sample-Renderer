<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>glTF Sample Renderer benchmark</title>
        <link rel="icon" href="data:," />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
        <script src="libs/libktx.js"></script>
        <script type="importmap">
            { "imports": { "gl-matrix": "/node_modules/gl-matrix/esm/index.js" } }
        </script>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <script type="module">
            import { GltfView, GltfState } from "/dist/gltf-viewer.module.js";

            const params = new URLSearchParams(location.search);
            const canvas = document.getElementById("canvas");
            canvas.width = Number(params.get("width"));
            canvas.height = Number(params.get("height"));

            const median = (values) => {
                const sorted = [...values].sort((a, b) => a - b);
                return sorted[Math.floor(sorted.length / 2)];
            };
            // performance.now() is coarsened to 0.1 ms, so short CPU times need the mean.
            const mean = (values) => values.reduce((a, b) => a + b, 0) / values.length;

            async function setup() {
                const context = canvas.getContext("webgl2", { alpha: false, antialias: false });
                const view = new GltfView(context);
                const resourceLoader = view.createResourceLoader((options) =>
                    options.onModuleLoaded(null)
                );
                const state = view.createState();
                state.renderingParameters.toneMap = GltfState.ToneMaps.KHR_PBR_NEUTRAL;
                state.environment = await resourceLoader.loadEnvironment(params.get("environment"));

                const gltf = await resourceLoader.loadGltf(params.get("model"), undefined, false);
                state.gltf = gltf;
                state.sceneIndex = gltf.scene ?? 0;
                gltf.scenes[state.sceneIndex].applyTransformHierarchy(gltf);
                state.userCamera.perspective.aspectRatio = canvas.width / canvas.height;
                state.userCamera.resetView(gltf, state.sceneIndex);

                const pixel = new Uint8Array(4);
                // Reading a pixel waits until the GPU finished the frame.
                const sync = () =>
                    context.readPixels(0, 0, 1, 1, context.RGBA, context.UNSIGNED_BYTE, pixel);

                // One camera revolution per round, so every round sees the same views.
                const run = (frames, synced) => {
                    const step = (2 * Math.PI) / frames / state.userCamera.orbitSpeed;
                    const times = [];
                    for (let i = 0; i < frames; i++) {
                        state.userCamera.orbit(step, 0);
                        const start = performance.now();
                        view.renderFrame(state, canvas.width, canvas.height);
                        if (synced) {
                            sync();
                        }
                        times.push(performance.now() - start);
                    }
                    sync();
                    return times;
                };

                const measure = async (frames, rounds) => {
                    run(Math.min(frames, 30), true);
                    const cpu = [];
                    const frame = [];
                    for (let r = 0; r < rounds; r++) {
                        cpu.push(...run(frames, false));
                        // Lets the browser present and collect garbage between rounds.
                        await new Promise(requestAnimationFrame);
                        frame.push(...run(frames, true));
                        await new Promise(requestAnimationFrame);
                    }
                    return { cpuMs: mean(cpu), frameMs: median(frame) };
                };

                const debugInfo = context.getExtension("WEBGL_debug_renderer_info");
                const gpu = debugInfo
                    ? context.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
                    : context.getParameter(context.RENDERER);

                return { gpu, measure };
            }

            window.benchmark = setup();
        </script>
    </body>
</html>
